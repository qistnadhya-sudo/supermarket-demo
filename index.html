<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Western & Grill | Digital Menu</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Toast Notification -->
  <div id="toastContainer" class="toast-container"></div>

  <div class="app-frame">
    
    <!-- SIDEBAR KIRI (DARK BROWN) -->
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand-circle-logo">
          <!-- Ikon Topi Chef & Sudu Garfu -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#472210" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
            <line x1="6" y1="17" x2="18" y2="17"/>
          </svg>
        </div>
        <div class="brand-title">
          <span>Western</span>
          <span>& Grill</span>
        </div>
      </div>

      <nav class="category-menu" id="categoryMenu">
        <button class="cat-btn active" data-category="MAIN COURSE">MAIN COURSE</button>
        <button class="cat-btn" data-category="PASTA & SPAGHETTI">PASTA & SPAGHETTI</button>
        <button class="cat-btn" data-category="SIDES">SIDES</button>
        <button class="cat-btn" data-category="COMBO">COMBO</button>
      </nav>
    </aside>

    <!-- BAHAGIAN KANAN (TOP BAR + KANDUNGAN PUTIH) -->
    <div class="right-section">
      
      <!-- Top Bar (Tel & Waktu Operasi) -->
      <header class="top-bar">
        <div class="top-info">
          <span>Tel : 012-3445678</span>
          <span class="time-info">
            <span class="clock-dot">🕒</span> Mon-Sat 11am-10pm
          </span>
        </div>
      </header>

      <!-- Tetingkap Putih Menu -->
      <main class="content-window">
        <!-- Butang Troli Bulat di Penjuru Kanan Atas -->
        <button class="floating-cart-btn" id="openCartBtn" title="View Cart">
          🛒
          <span class="cart-badge" id="cartBadge">0</span>
        </button>

        <h1 class="category-heading" id="categoryHeading">MAIN COURSE</h1>

        <!-- Grid Kad Makanan (4 Kolum) -->
        <div class="menu-grid" id="menuGrid">
          <!-- Dijana secara automatik oleh script.js -->
        </div>
      </main>

    </div>

  </div>

  <!-- FOOTER BAWAH (SOCIAL MEDIA) -->
  <footer class="bottom-bar">
    <div class="footer-inner">
      <span>Facebook : Western & Grill</span>
      <span>Instagram : WesternGrill.co</span>
      <span>Thread : Western & Grill by nana</span>
    </div>
  </footer>

  <!-- SLIDE-OUT CART DRAWER -->
  <div id="cartOverlay" class="cart-overlay"></div>
  <aside id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3>🛒 Pesanan Anda</h3>
      <button id="closeCartBtn" class="close-btn">&times;</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <!-- KELAS PEMBUNGKUS FOOTER CART YANG DIPERBETULKAN -->
    <div class="cart-drawer-footer">
      <div class="form-group">
        <label for="custName">Nama Pelanggan *</label>
        <input type="text" id="custName" placeholder="Masukkan nama anda" />
      </div>

      <div class="form-group">
        <label for="custAddress">Alamat Penghantaran / Lokasi COD *</label>
        <input type="text" id="custAddress" placeholder="Cth: Taman Seri Mawar / UMP / Kolej..." />
      </div>

      <div class="form-group">
        <label for="orderType">Jenis Perkhidmatan / Penghantaran</label>
        <select id="orderType">
          <option value="COD - Kawasan Bandar (Free)">COD - Kawasan Bandar (Percuma)</option>
          <option value="COD - Luar Bandar / Jauh (+RM5.00)">COD - Luar Bandar / Jauh (+RM5.00)</option>
          <option value="Self-Pickup / Ambil Sendiri">Self-Pickup / Ambil Sendiri</option>
        </select>
      </div>

      <div class="total-row">
        <span>Jumlah Keseluruhan</span>
        <strong id="cartTotal">RM 0.00</strong>
      </div>

      <button id="checkoutBtn" class="whatsapp-checkout-btn">
        Hantar Order ke WhatsApp 💬
      </button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
